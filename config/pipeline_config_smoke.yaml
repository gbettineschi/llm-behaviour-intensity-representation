project_name: ordinal_geometry_dataset_smoke
output_dir: output_smoke
traits:
  - politeness
  - hedging_confidence

models:
  generator:
    model: openrouter/openai/gpt-oss-120b:free
    family: openai
    temperature: 0.7
    max_output_tokens: 1400
  judge:
    model: openrouter/qwen/qwen-2.5-7b-instruct
    family: qwen
    temperature: 0.0
    max_output_tokens: 1400
  tie_breaker_judge:
    model: openrouter/mistralai/mistral-small-24b-instruct-2501
    family: mistral
    temperature: 0.0
    max_output_tokens: 1400

pipeline:
  scenarios_per_trait: 10
  paraphrases_per_level: 1
  levels: [low, mid, high]
  min_acceptance_score: 0.6
  tie_breaker_margin: 0.15
  max_workers: 5
  max_retries: 1
  max_shortcut_repair_rounds: 0
  human_validation_fraction: 1.0
  max_duplicate_jaccard: 0.85
  lexical_baseline_warning_accuracy: 0.45
  max_length_ratio: 1.2
  require_cross_family_judge: true
  use_bws_exports: true

validation:
  require_content_preservation: true
  require_monotonic_order: true
  require_naturalness: true
  require_cue_diversity: true
  reject_if_same_family_generator_and_judge: false
  warn_if_same_family_generator_and_judge: true
